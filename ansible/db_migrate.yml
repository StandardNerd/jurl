# run migrations inside lxc 101:
# ansible-playbook ./ansible/db_migrate.yml -i ansible/inventory.ini
---
- name: Run Database Migrations in Proxmox LXC Container ID 101
  hosts: proxmox_hosts
  gather_facts: false
  vars:
    lxc_id: 101
    build_dir: "/tmp/jurl-build"
    app_dir: "/opt/jurl"
    app_user: "phoenix"
    env_file: "/etc/jurl/jurl.env"
    db_host: "192.168.1.20"
    db_user: "jurl"
    db_pass: "{{ vault_db_password | default('<your-db-password>') }}"
    app_ip: "192.168.1.21"
    app_port: 4000
    project_root: "{{ playbook_dir }}/.."

  tasks:
    - name: 1. Verify LXC Container {{ lxc_id }} is running
      ansible.builtin.command: pct status {{ lxc_id }}
      register: lxc_status
      changed_when: false
      failed_when: "'status: running' not in lxc_status.stdout"

    - name: 9. Run database migrations inside LXC {{ lxc_id }}
      ansible.builtin.command: >
        pct exec {{ lxc_id }} -- bash -c "set -a && source {{ env_file }} && set +a && cd {{ build_dir }} && MIX_ENV=prod mix ecto.migrate"
      changed_when: true

